<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>무대 위 알고리즘</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F4F6FB; --paper:#FFFFFF; --ink:#141824; --sub:#4A5268; --muted:#8A92A6; --line:#E3E7F0; --fill:#EEF1F8;
  --blue:#2F6BFF; --blue-soft:#E7EEFF; --pink:#FF3D71; --pink-soft:#FFE8EE; --green:#10A95B; --green-soft:#E4F7EC;
  --amber:#F59E0B; --amber-soft:#FFF4DC; --violet:#7C4DFF; --violet-soft:#EFE8FF;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Code",Consolas,"D2Coding",monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:22px;line-height:1.55;word-break:keep-all;min-height:100vh}
[hidden]{display:none!important}
button,input,select{font:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:24px 16px 60px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.back{appearance:none;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 16px;cursor:pointer;font-weight:700;color:var(--sub)}
.back:hover{border-color:var(--blue);color:var(--blue)}
.tag{font-size:15px;font-weight:800;letter-spacing:.06em;color:var(--blue);background:var(--blue-soft);border-radius:99px;padding:4px 12px}
h1{font-size:52px;line-height:1.15;margin:6px 0 4px;letter-spacing:-.02em}
h2{font-size:38px;line-height:1.2;margin:4px 0;letter-spacing:-.02em}
.sub{color:var(--sub)}
.muted{color:var(--muted);font-size:18px}
.card{background:var(--paper);border-radius:22px;padding:26px;margin-top:18px;box-shadow:0 1px 2px rgba(20,24,36,.04),0 8px 24px rgba(20,24,36,.05)}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 26px;font-weight:800;cursor:pointer;background:var(--blue);color:#fff;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--fill);color:var(--ink)}
.btn.pink{background:var(--pink)}.btn.green{background:var(--green)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}
.inp{flex:1;min-width:200px;background:var(--fill);border:2px solid transparent;border-radius:14px;padding:12px 16px;outline:none;color:var(--ink)}
.inp:focus{border-color:var(--blue);background:#fff}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.stat{background:var(--fill);border-radius:14px;padding:8px 18px;font-size:19px;color:var(--sub)}
.stat b{font-size:30px;color:var(--ink);font-variant-numeric:tabular-nums;margin-left:6px}
.banner{margin-top:18px;border-radius:16px;padding:16px 22px;font-weight:700}
.banner.ok{background:var(--green-soft);color:#08713D}
.banner.bad{background:var(--pink-soft);color:#C21746}
.banner.info{background:var(--blue-soft);color:#1E48B8}
.explain{margin-top:14px;background:var(--amber-soft);border-radius:14px;padding:14px 20px;color:#6B4A00;font-size:20px}
.explain b{color:#3D2A00}

/* menu */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;margin-top:22px}
.tile{appearance:none;text-align:left;border:0;background:var(--paper);border-radius:22px;padding:24px;cursor:pointer;box-shadow:0 1px 2px rgba(20,24,36,.04),0 8px 24px rgba(20,24,36,.05);transition:transform .15s,box-shadow .15s;color:var(--ink)}
.tile:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(20,24,36,.1)}
.tile .ic{font-size:40px}
.tile h3{font-size:28px;margin:6px 0 4px}
.tile p{margin:0;color:var(--sub);font-size:18px}
.tile .meta{margin-top:10px;font-size:15px;font-weight:700;color:var(--muted)}

/* search duel */
.target{display:inline-block;background:var(--ink);color:#fff;border-radius:16px;padding:6px 22px;font-size:44px;font-weight:900;font-variant-numeric:tabular-nums}
.lane{margin-top:22px}
.lane h3{margin:0;font-size:26px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lane .cnt{font-variant-numeric:tabular-nums;font-size:22px;color:var(--sub)}
.lane .cnt b{font-size:34px;color:var(--ink)}
.cards31{display:grid;grid-template-columns:repeat(31,1fr);gap:4px;margin-top:10px}
.sc{aspect-ratio:3/4.4;border:0;border-radius:8px;background:linear-gradient(180deg,#3B4A75,#26304F);color:#fff;font-weight:900;font-size:clamp(11px,1.3vw,18px);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .15s,opacity .3s}
.sc:hover:not(:disabled){transform:translateY(-4px)}
.sc.up{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.sc.hit{background:var(--green);color:#fff;transform:scale(1.15)}
.sc.out{opacity:.18}
.sc.next{box-shadow:0 0 0 3px var(--amber)}
.sc:disabled{cursor:default}
.idx{display:grid;grid-template-columns:repeat(31,1fr);gap:4px;font-size:11px;color:var(--muted);text-align:center;margin-top:2px}

/* sorting */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tabs button{appearance:none;border:0;background:var(--fill);border-radius:12px;padding:10px 20px;font-weight:800;cursor:pointer;color:var(--sub)}
.tabs button.on{background:var(--ink);color:#fff}
.stage{display:flex;align-items:flex-end;justify-content:center;gap:10px;flex-wrap:wrap;min-height:190px;margin-top:22px}
.nc{width:96px;height:130px;border-radius:16px;border:0;background:var(--paper);box-shadow:inset 0 0 0 3px var(--line);font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;display:grid;place-items:center;transition:transform .25s,background .2s,box-shadow .2s;color:var(--ink)}
button.nc{cursor:pointer}
button.nc:hover{box-shadow:inset 0 0 0 3px var(--blue)}
.nc.done{background:var(--green-soft);box-shadow:inset 0 0 0 3px var(--green);color:#08713D}
.nc.focus{box-shadow:inset 0 0 0 4px var(--amber);background:var(--amber-soft);transform:translateY(-10px)}
.nc.lift{transform:translateY(-34px);background:var(--violet-soft);box-shadow:inset 0 0 0 4px var(--violet)}
.nc.dim{opacity:.4}
.nc.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.gap{appearance:none;width:34px;height:130px;border-radius:10px;border:3px dashed var(--violet);background:var(--violet-soft);color:var(--violet);font-weight:900;cursor:pointer}
.gap:hover{background:var(--violet);color:#fff}
.decide{display:flex;gap:14px;justify-content:center;margin-top:20px}
.decide .btn{font-size:26px;padding:16px 36px}
.rule{margin-top:10px;font-size:20px;color:var(--sub);text-align:center}

/* cipher */
.big-ct{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.big-ct span{min-width:58px;height:76px;padding:0 6px;display:grid;place-items:center;border-radius:12px;background:var(--pink-soft);color:#C21746;font-family:var(--mono);font-size:42px;font-weight:900}
.big-ct.plain span{background:var(--blue-soft);color:#1E48B8}
.big-ct span.sp{background:transparent;min-width:24px}
.strip{display:grid;grid-template-columns:repeat(26,1fr);gap:3px;margin-top:6px;font-family:var(--mono);font-weight:800;font-size:clamp(12px,1.4vw,20px);text-align:center}
.strip div{background:var(--fill);border-radius:6px;padding:4px 0}
.strip.b div{background:var(--blue-soft);color:#1E48B8}
.slider{width:100%;margin-top:18px;accent-color:var(--blue);height:30px}
.keyv{font-size:40px;font-weight:900;color:var(--blue);font-variant-numeric:tabular-nums}
.tgrid{display:inline-grid;gap:6px;margin-top:14px}
.tgrid div{width:62px;height:62px;display:grid;place-items:center;border-radius:10px;background:var(--fill);font-family:var(--mono);font-size:32px;font-weight:900}
.tgrid div.c0{background:#FFE8EE}.tgrid div.c1{background:#E7EEFF}.tgrid div.c2{background:#E4F7EC}.tgrid div.c3{background:#FFF4DC}.tgrid div.c4{background:#EFE8FF}.tgrid div.c5{background:#E0F7FA}.tgrid div.c6{background:#FCE7F3}.tgrid div.c7{background:#F1F5F9}
.colbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.colbtns button{appearance:none;border:0;width:74px;height:64px;border-radius:14px;background:var(--fill);font-size:28px;font-weight:900;cursor:pointer;color:var(--ink)}
.colbtns button.on{background:var(--ink);color:#fff}
.readout{margin-top:14px;font-family:var(--mono);font-size:34px;font-weight:900;letter-spacing:.06em}

/* quiz */
pre.code{background:#121726;color:#E8EEFF;border-radius:18px;padding:22px 26px;font-family:var(--mono);font-size:30px;line-height:1.6;overflow-x:auto;margin:18px 0 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.opt{appearance:none;border:0;border-radius:16px;padding:18px 22px;text-align:left;font-size:28px;font-weight:800;background:var(--fill);cursor:pointer;color:var(--ink);font-family:var(--mono)}
.opt:hover:not(:disabled){background:var(--blue-soft)}
.opt .n{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#fff;margin-right:12px;font-family:var(--font);font-size:20px}
.opt.right{background:var(--green);color:#fff}
.opt.wrong{background:var(--pink);color:#fff}
.opt:disabled{cursor:default}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pill{background:var(--fill);border-radius:99px;padding:6px 16px;font-weight:800;font-size:18px;color:var(--sub)}
@media (max-width:760px){body{font-size:18px}h1{font-size:36px}h2{font-size:28px}.opts{grid-template-columns:1fr}.nc{width:64px;height:90px;font-size:30px}.gap{height:90px;width:26px}pre.code{font-size:20px}.opt{font-size:20px}}
/* showcase frame */
.hud{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(244,246,251,.92);backdrop-filter:blur(8px);padding:10px 0;border-bottom:1px solid var(--line)}
.who{font-weight:900;font-size:22px}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{appearance:none;border:0;border-radius:99px;padding:6px 14px;font-size:16px;font-weight:800;background:var(--paper);color:var(--muted);cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
.chip.now{background:var(--ink);color:#fff;box-shadow:none}
.chip.ok{color:var(--green)}
.chip.ok.now{color:#fff;background:var(--green)}
.nextbar{display:flex;justify-content:flex-end;align-items:center;gap:18px;margin-top:22px}
.nextbar .btn{font-size:24px;padding:16px 34px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:16px}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(47,107,255,.5)}50%{box-shadow:0 0 0 12px rgba(47,107,255,0)}}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.stepi{background:var(--fill);border-radius:16px;padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.stepi .n{font-size:14px;font-weight:800;color:var(--muted)}
.stepi .ic{font-size:36px}
@media (max-width:760px){.steps{grid-template-columns:1fr 1fr}}
.lane .cnt{margin-left:auto}
.lane .num{color:var(--blue)}
.lane.locked{opacity:.35;pointer-events:none}
.ph{margin:0 0 10px;font-size:26px}
.hl{background:var(--blue-soft);color:#1E48B8;border-radius:8px;padding:0 8px;font-family:var(--mono)}
.mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;font-size:28px;font-weight:800}
.tabs button:disabled{cursor:default}
.tabs button.fin{color:var(--green)}
.tabs button.fin.on{background:var(--green);color:#fff}
table.cmp{border-collapse:collapse;margin-top:16px;width:100%;font-size:22px}
table.cmp th,table.cmp td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:center}
table.cmp td:first-child{text-align:left;font-weight:700;color:var(--sub)}
table.cmp.rec td{text-align:left}
table.cmp.rec td:last-child{font-weight:800}
.list{margin:18px 0 0;padding-left:22px;color:var(--sub)}
.list li{margin:6px 0}.list b{color:var(--ink)}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[rnd(0, a.length - 1)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = ms => { const t = Math.max(0, Math.floor(ms / 1000)); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
const app = $('#app');

const STEPS = [
  { k: 'search', ic: '🔎', t: '탐색', f: stepSearch },
  { k: 'sort', ic: '📊', t: '정렬', f: stepSort },
  { k: 'caesar', ic: '🔐', t: '카이사르 암호', f: stepCaesar },
  { k: 'trans', ic: '🧩', t: '전치 암호', f: stepTrans },
  { k: 'quiz', ic: '🐍', t: '자료구조', f: stepQuiz },
];
let S;
const fresh = () => ({ name: '', start: 0, end: 0, step: -1, done: {}, rec: {} });
S = fresh();

/* ---------- frame ---------- */
function frame(i, desc, body) {
  const st = STEPS[i];
  app.innerHTML = `
    <div class="hud">
      <span class="who">🎤 ${esc(S.name)}</span>
      <div class="chips">${STEPS.map((s, k) => `<button class="chip ${k === i ? 'now' : ''} ${S.done[s.k] ? 'ok' : ''}" data-k="${k}">${S.done[s.k] ? '✓' : k + 1} ${s.t}</button>`).join('')}</div>
      <span class="pill">⏱ <b id="timer">00:00</b></span>
    </div>
    <div class="top" style="margin-top:18px"><span class="tag">STEP ${i + 1} / ${STEPS.length}</span></div>
    <h2>${st.ic} ${st.t}</h2>
    <p class="sub" style="margin:4px 0 0">${desc}</p>
    ${body}
    <div class="nextbar"><button class="link" id="skip">건너뛰기</button><button class="btn" id="next" disabled>${i + 1 < STEPS.length ? '다음 단계 →' : '쇼케이스 마치기 →'}</button></div>`;
  app.querySelectorAll('.chip').forEach(b => b.onclick = () => go(+b.dataset.k));
  $('#next').onclick = $('#skip').onclick = () => go(i + 1);
  if (S.done[st.k]) $('#next').disabled = false;
  tick();
}
function complete(k) {
  S.done[k] = true;
  const n = $('#next'); if (n) { n.disabled = false; n.classList.add('pulse'); }
  const chip = app.querySelector(`.chip[data-k="${STEPS.findIndex(s => s.k === k)}"]`);
  if (chip) { chip.classList.add('ok'); chip.textContent = '✓ ' + STEPS.find(s => s.k === k).t; }
}
function go(i) {
  if (i >= STEPS.length) { S.end = S.end || Date.now(); return finale(); }
  S.step = i; STEPS[i].f(); window.scrollTo(0, 0);
}
function tick() { const t = $('#timer'); if (t && S.start) t.textContent = fmt((S.end || Date.now()) - S.start); }
setInterval(tick, 1000);

/* ---------- intro ---------- */
function intro() {
  app.innerHTML = `<div class="top"><span class="tag">정보 수업 · 지식 쇼케이스</span></div>
    <h1>무대 위 알고리즘</h1>
    <p class="sub">한 학생이 나와서 이번 단원에서 배운 내용을 직접 시연합니다.</p>
    <div class="card">
      <div class="steps">${STEPS.map((s, k) => `<div class="stepi"><span class="n">${k + 1}</span><span class="ic">${s.ic}</span><b>${s.t}</b></div>`).join('')}</div>
      <div class="row" style="margin-top:22px">
        <input class="inp" id="nm" maxlength="16" placeholder="발표자 이름" autocomplete="off">
        <button class="btn" id="go">쇼케이스 시작</button>
      </div>
    </div>`;
  const start = () => { S = fresh(); S.name = $('#nm').value.trim() || '발표자'; S.start = Date.now(); go(0); };
  $('#go').onclick = start;
  $('#nm').onkeydown = e => { if (e.key === 'Enter') start(); };
}

/* ================= 1. SEARCH ================= */
function stepSearch() {
  const N = 31;
  const nums = shuffle(Array.from({ length: 99 }, (_, i) => i + 1)).slice(0, N).sort((a, b) => a - b);
  const target = nums[rnd(14, N - 1)];
  const seq = { up: new Set(), next: 0, count: 0, found: false };
  const bin = { up: new Set(), lo: 0, hi: N - 1, count: 0, found: false };
  frame(0, '카드 31장에 1~99 사이 숫자가 <b>작은 순서대로</b> 엎어져 있어요. 같은 숫자를 두 가지 방법으로 찾아봅니다.', `
    <div class="card">
      <div class="row" style="margin-top:0">찾을 숫자 <span class="target">${target}</span></div>
      <div class="lane" id="l1"><h3><span class="num">①</span> 순차 탐색 <span class="muted">처음부터 한 장씩</span><span class="cnt">뒤집은 횟수 <b id="sc">0</b></span></h3>
        <div class="cards31" id="sl"></div><div class="idx">${Array.from({ length: N }, (_, i) => `<span>${i + 1}</span>`).join('')}</div></div>
      <div class="lane locked" id="l2"><h3><span class="num">②</span> 이진 탐색 <span class="muted">어디를 먼저 볼지 직접 정하세요</span><span class="cnt">뒤집은 횟수 <b id="bc">0</b></span></h3>
        <div class="cards31" id="bl"></div><div class="idx">${Array.from({ length: N }, (_, i) => `<span>${i + 1}</span>`).join('')}</div></div>
      <div id="res"></div>
    </div>`);
  const draw = () => {
    $('#l2').classList.toggle('locked', !seq.found);
    $('#sl').innerHTML = nums.map((v, i) => {
      const up = seq.up.has(i), hit = up && v === target;
      return `<button class="sc ${up ? 'up' : ''} ${hit ? 'hit' : ''} ${!seq.found && i === seq.next ? 'next' : ''}" data-i="${i}" ${seq.found || i !== seq.next ? 'disabled' : ''}>${up ? v : '?'}</button>`;
    }).join('');
    $('#bl').innerHTML = nums.map((v, i) => {
      const up = bin.up.has(i), hit = up && v === target, out = !bin.found && !up && (i < bin.lo || i > bin.hi);
      return `<button class="sc ${up ? 'up' : ''} ${hit ? 'hit' : ''} ${out ? 'out' : ''}" data-i="${i}" ${!seq.found || bin.found || up || out ? 'disabled' : ''}>${up ? v : '?'}</button>`;
    }).join('');
    $('#sc').textContent = seq.count; $('#bc').textContent = bin.count;
    $('#sl').querySelectorAll('.sc:not(:disabled)').forEach(b => b.onclick = () => { const i = +b.dataset.i; seq.up.add(i); seq.count++; seq.next++; if (nums[i] === target) seq.found = true; draw(); });
    $('#bl').querySelectorAll('.sc:not(:disabled)').forEach(b => b.onclick = () => {
      const i = +b.dataset.i; bin.up.add(i); bin.count++;
      if (nums[i] === target) bin.found = true; else if (nums[i] < target) bin.lo = Math.max(bin.lo, i + 1); else bin.hi = Math.min(bin.hi, i - 1);
      draw();
    });
    let h = '';
    if (seq.found && !bin.up.size) h = `<div class="banner info">순차 탐색으로 <b>${seq.count}번</b> 만에 찾았어요. 이번엔 카드가 <b>정렬되어 있다는 점</b>을 이용해 이진 탐색으로 찾아보세요.</div>`;
    else if (seq.found && !bin.found) h = `<div class="banner info">남은 후보 <b>${bin.hi - bin.lo + 1}장</b>. 흐려진 카드는 더 볼 필요가 없는 카드예요.</div>`;
    else if (bin.found) {
      h = `<div class="banner ok">🏁 순차 탐색 <b>${seq.count}번</b> → 이진 탐색 <b>${bin.count}번</b></div>
        <div class="explain"><b>순차 탐색</b>은 처음부터 하나씩 보기 때문에 최악의 경우 31번이 걸려요.
        <b>이진 탐색</b>은 가운데를 보고 절반을 버리기 때문에 31장이면 <b>최대 5번</b>이면 충분합니다 (31 → 15 → 7 → 3 → 1).
        단, 이진 탐색은 데이터가 <b>정렬되어 있을 때만</b> 쓸 수 있어요.</div>`;
      S.rec.search = `순차 ${seq.count}번 → 이진 ${bin.count}번`;
      complete('search');
    }
    $('#res').innerHTML = h;
  };
  draw();
}

/* ================= 2. SORT ================= */
const SORTS = {
  bubble: { t: '버블 정렬', r: '노란 두 카드를 비교하세요. 왼쪽이 더 크면 <b>교환</b>, 아니면 <b>그대로</b>.', e: '이웃한 두 값을 비교해 큰 값을 오른쪽으로 보내요. 한 바퀴마다 가장 큰 값이 맨 끝에 자리 잡습니다.' },
  select: { t: '선택 정렬', r: '정렬되지 않은 카드 중 <b>가장 작은 카드</b>를 클릭하세요. 맨 앞으로 옮겨집니다.', e: '남은 것 중 가장 작은 값을 "선택"해 앞으로 보내요. 교환은 적지만 매번 남은 카드를 모두 비교해야 해요.' },
  insert: { t: '삽입 정렬', r: '보라색 카드가 들어갈 <b>자리(점선)</b>를 클릭하세요.', e: '카드 게임에서 패를 정리하듯, 새 카드를 정렬된 카드들 사이 알맞은 자리에 "삽입"해요. 거의 정렬된 데이터에서 아주 빠릅니다.' },
};
const ORDER = ['bubble', 'select', 'insert'];
function stepSort() {
  const res = {};
  frame(1, '같은 일을 하는 세 가지 정렬 알고리즘을 차례로 시연합니다. 규칙을 어기면 카드가 흔들려요.', `
    <div class="tabs" id="tabs"></div>
    <div class="card">
      <div class="rule" id="rule"></div>
      <div class="stage" id="stg"></div>
      <div id="ctl"></div>
      <div class="stats"><div class="stat">비교<b id="c1">0</b></div><div class="stat">이동·교환<b id="c2">0</b></div><div class="stat">실수<b id="c3">0</b></div></div>
      <div id="res"></div>
    </div>`);
  const tabs = cur => {
    $('#tabs').innerHTML = ORDER.map((m, k) => `<button class="${m === cur ? 'on' : ''} ${res[m] ? 'fin' : ''}" disabled>${res[m] ? '✓' : k + 1} ${SORTS[m].t}</button>`).join('');
  };
  const run = mi => {
    const mode = ORDER[mi]; tabs(mode);
    sortEngine(mode, 5, stats => {
      res[mode] = stats; tabs(mode);
      const last = mi === ORDER.length - 1;
      $('#res').innerHTML = `<div class="banner ok">🎉 ${SORTS[mode].t} 완료! 비교 ${stats.comp}번 · 이동·교환 ${stats.swap}번 · 실수 ${stats.miss}번</div>
        <div class="explain"><b>${SORTS[mode].t}</b> — ${SORTS[mode].e}</div>
        ${last ? compareTable(res) : `<div class="row" style="justify-content:flex-end"><button class="btn" id="nx">다음: ${SORTS[ORDER[mi + 1]].t} →</button></div>`}`;
      if (last) { S.rec.sort = ORDER.map(m => `${SORTS[m].t} 실수 ${res[m].miss}번`).join(' · '); complete('sort'); }
      else $('#nx').onclick = () => { $('#res').innerHTML = ''; run(mi + 1); };
    });
  };
  run(0);
}
function compareTable(res) {
  return `<table class="cmp"><tr><th></th>${ORDER.map(m => `<th>${SORTS[m].t}</th>`).join('')}</tr>
    <tr><td>비교</td>${ORDER.map(m => `<td>${res[m].comp}</td>`).join('')}</tr>
    <tr><td>이동·교환</td>${ORDER.map(m => `<td>${res[m].swap}</td>`).join('')}</tr></table>
    <p class="muted" style="margin-top:8px">세 방법 모두 결과는 같지만, 일하는 방식과 횟수가 달라요. 데이터가 많아질수록 이 차이가 커집니다.</p>`;
}
function sortEngine(mode, N, onDone) {
  const a = shuffle(Array.from({ length: 40 }, (_, i) => i + 1)).slice(0, N);
  const st = { comp: 0, swap: 0, miss: 0, done: false, i: mode === 'insert' ? 1 : 0, j: 0, pass: 0, swapped: false, sortedFrom: N };
  const miss = (el, msg) => { st.miss++; $('#c3').textContent = st.miss; if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } $('#res').innerHTML = `<div class="banner bad">${msg}</div>`; };
  const card = (v, cls = '', tag = 'div', attrs = '') => `<${tag} class="nc ${cls}" ${attrs}>${v}</${tag}>`;
  const finish = () => { st.done = true; draw(); onDone({ comp: st.comp, swap: st.swap, miss: st.miss }); };
  function draw() {
    $('#rule').innerHTML = st.done ? '' : SORTS[mode].r;
    $('#c1').textContent = st.comp; $('#c2').textContent = st.swap; $('#c3').textContent = st.miss;
    let h = '', ctl = '';
    if (st.done) h = a.map(v => card(v, 'done')).join('');
    else if (mode === 'bubble') {
      h = a.map((v, k) => card(v, k >= st.sortedFrom ? 'done' : (k === st.j || k === st.j + 1 ? 'focus' : ''))).join('');
      ctl = `<div class="decide"><button class="btn pink" id="sw">⇄ 교환</button><button class="btn ghost" id="keep">그대로 →</button></div>`;
    } else if (mode === 'select') {
      h = a.map((v, k) => k < st.i ? card(v, 'done') : card(v, '', 'button', `data-k="${k}"`)).join('');
    } else {
      for (let k = 0; k <= st.i; k++) { h += `<button class="gap" data-g="${k}" aria-label="${k + 1}번째 자리">▼</button>`; if (k < st.i) h += card(a[k], 'done'); }
      h += card(a[st.i], 'lift');
      for (let k = st.i + 1; k < N; k++) h += card(a[k], 'dim');
    }
    $('#stg').innerHTML = h; $('#ctl').innerHTML = ctl;
    if (st.done) return;
    if (mode === 'bubble') {
      const decide = doSwap => {
        if ((a[st.j] > a[st.j + 1]) !== doSwap) return miss($('#stg').children[st.j], `${a[st.j]}와(과) ${a[st.j + 1]}을(를) 다시 비교해 보세요.`);
        $('#res').innerHTML = ''; st.comp++;
        if (doSwap) { [a[st.j], a[st.j + 1]] = [a[st.j + 1], a[st.j]]; st.swap++; st.swapped = true; }
        st.j++;
        if (st.j >= N - 1 - st.pass) {
          st.sortedFrom = N - 1 - st.pass; st.pass++;
          if (!st.swapped || st.pass >= N - 1) return finish();
          st.j = 0; st.swapped = false;
        }
        draw();
      };
      $('#sw').onclick = () => decide(true); $('#keep').onclick = () => decide(false);
    } else if (mode === 'select') {
      $('#stg').querySelectorAll('button.nc').forEach(b => b.onclick = () => {
        const k = +b.dataset.k, min = Math.min(...a.slice(st.i));
        if (a[k] !== min) return miss(b, `${a[k]}보다 더 작은 카드가 남아 있어요.`);
        $('#res').innerHTML = ''; st.comp += N - 1 - st.i;
        if (k !== st.i) { [a[k], a[st.i]] = [a[st.i], a[k]]; st.swap++; }
        st.i++;
        if (st.i >= N - 1) return finish();
        draw();
      });
    } else {
      $('#stg').querySelectorAll('.gap').forEach(b => b.onclick = () => {
        const g = +b.dataset.g, key = a[st.i];
        let right = 0; while (right < st.i && a[right] <= key) right++;
        if (g !== right) return miss(b, `${key}이(가) 들어가기에 알맞은 자리가 아니에요. 양옆 숫자를 보세요.`);
        $('#res').innerHTML = ''; st.comp += Math.min(st.i, st.i - g + 1);
        if (g !== st.i) { a.splice(st.i, 1); a.splice(g, 0, key); st.swap += st.i - g; }
        st.i++;
        if (st.i >= N) return finish();
        draw();
      });
    }
  }
  draw();
}

/* ================= 3. CAESAR ================= */
const AZ = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const shiftC = (s, k) => s.split('').map(c => { const i = AZ.indexOf(c); return i < 0 ? c : AZ[(i + k + 26) % 26]; }).join('');
const letters = (s, cls = '') => `<div class="big-ct ${cls}">${s.split('').map(c => c === ' ' ? '<span class="sp"></span>' : `<span>${esc(c)}</span>`).join('')}</div>`;
function stepCaesar() {
  const msg = pick(['HELLO WORLD', 'PYTHON IS FUN', 'BINARY SEARCH', 'DATA IS POWER', 'KEEP CODING']);
  const key = rnd(4, 22), ct = shiftC(msg, key);
  const ENC = pick([{ p: 'CODE', k: 3 }, { p: 'LIST', k: 2 }, { p: 'SORT', k: 4 }, { p: 'DATA', k: 5 }]);
  const tries = new Set([0]);
  frame(2, '알파벳을 정해진 칸 수(키)만큼 밀어서 글자를 <b>바꾸는</b> 치환 암호예요. 해독하고, 직접 암호화까지 해 봅니다.', `
    <div class="card">
      <h3 class="ph">미션 A · 키를 모르는 암호문 해독하기</h3>
      <div class="muted">🔒 암호문</div>${letters(ct)}
      <input type="range" class="slider" id="k" min="0" max="25" value="0">
      <div class="row" style="justify-content:space-between;margin-top:4px"><span>뒤로 민 칸 수 <span class="keyv" id="kv">0</span></span><span class="muted" id="tr"></span></div>
      <div class="strip">${AZ.split('').map(c => `<div>${c}</div>`).join('')}</div>
      <div class="strip b" id="s2"></div>
      <div class="muted" style="margin-top:14px">🔓 해독 결과</div><div id="pt"></div>
      <div id="resA"></div>
    </div>
    <div class="card" id="cardB" hidden>
      <h3 class="ph">미션 B · 직접 암호화하기</h3>
      <p class="sub" style="margin:0">단어 <b class="hl">${ENC.p}</b>를 키 <b class="hl">${ENC.k}</b>로 암호화하면? (각 글자를 ${ENC.k}칸 <b>앞으로</b> 밀기)</p>
      <div class="strip">${AZ.split('').map(c => `<div>${c}</div>`).join('')}</div>
      <div class="row"><input class="inp mono" id="enc" maxlength="12" placeholder="암호문 입력" autocomplete="off"><button class="btn" id="encBtn">확인</button></div>
      <div id="resB"></div>
    </div>`);
  let solved = false;
  const draw = k => {
    $('#kv').textContent = k; tries.add(k);
    $('#tr').textContent = `시도한 키 ${tries.size}개 / 26개`;
    $('#s2').innerHTML = AZ.split('').map(c => `<div>${shiftC(c, -k)}</div>`).join('');
    $('#pt').innerHTML = letters(shiftC(ct, -k), 'plain');
    if (k === key && !solved) {
      solved = true; $('#k').disabled = true;
      $('#resA').innerHTML = `<div class="banner ok">🎉 해독 성공! 키는 <b>${key}</b>, 메시지는 "<b>${msg}</b>"</div>
        <div class="explain">키가 <b>26가지</b>뿐이라 하나씩 다 시도해 보면(<b>무차별 대입</b>) 금방 풀려요. 그래서 현대 암호는 키의 경우의 수를 엄청나게 크게 만듭니다.</div>`;
      $('#cardB').hidden = false; $('#cardB').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  };
  $('#k').oninput = e => draw(+e.target.value);
  draw(0);
  const check = () => {
    const v = $('#enc').value.toUpperCase().replace(/\s+/g, '');
    if (!v) return;
    if (v === shiftC(ENC.p, ENC.k)) {
      $('#enc').disabled = $('#encBtn').disabled = true;
      $('#resB').innerHTML = `<div class="banner ok">🎉 정답! ${ENC.p} → <b>${shiftC(ENC.p, ENC.k)}</b></div>`;
      S.rec.caesar = `해독(키 ${key}) + 암호화 성공`;
      complete('caesar');
    } else $('#resB').innerHTML = `<div class="banner bad">다시 해 보세요. 첫 글자 ${ENC.p[0]}에서 ${ENC.k}칸 뒤의 글자는?</div>`;
  };
  $('#encBtn').onclick = check;
  $('#enc').onkeydown = e => { if (e.key === 'Enter') check(); };
}

/* ================= 4. TRANSPOSITION ================= */
function stepTrans() {
  const P = pick([{ m: 'WE_LOVE_CODING', k: 4 }, { m: 'SORTING_IS_FUN', k: 3 }, { m: 'KEEP_LEARNING', k: 5 }, { m: 'HELLO_PYTHON', k: 4 }]);
  let p = P.m; while (p.length % P.k) p += '·';
  const R = p.length / P.k; let ct = '';
  for (let c = 0; c < P.k; c++) for (let r = 0; r < R; r++) ct += p[r * P.k + c];
  const L = ct.length;
  const E = pick(['ABCDEF', 'PYTHON', 'SEARCH']);
  const ER = 2, EC = 3, eAns = [0, 1, 2].map(c => E[c] + E[c + 3]).join('');
  frame(3, '글자는 그대로 두고 <b>순서만</b> 뒤섞는 암호예요. 표에 가로로 쓰고, 세로로 읽어서 만듭니다.', `
    <div class="card">
      <h3 class="ph">미션 A · 표의 칸 수를 찾아 해독하기</h3>
      <div class="muted">🔒 암호문 (${L}글자, _ 는 띄어쓰기, · 는 빈칸 채우기)</div>${letters(ct)}
      <div class="muted" style="margin-top:18px">표의 칸 수를 골라 보세요</div>
      <div class="colbtns" id="cb">${[2, 3, 4, 5, 6, 7].map(n => `<button data-n="${n}">${n}</button>`).join('')}</div>
      <div id="view"></div>
      <div id="resA"></div>
    </div>
    <div class="card" id="cardB" hidden>
      <h3 class="ph">미션 B · 직접 암호화하기</h3>
      <p class="sub" style="margin:0"><b class="hl">${E}</b>를 3칸짜리 표에 <b>가로로</b> 썼어요. <b>세로로</b> 읽으면 암호문은?</p>
      <div class="tgrid" style="grid-template-columns:repeat(${EC},62px)">${E.split('').map((ch, i) => `<div class="c${i % EC}">${ch}</div>`).join('')}</div>
      <div class="row"><input class="inp mono" id="enc" maxlength="12" placeholder="암호문 입력" autocomplete="off"><button class="btn" id="encBtn">확인</button></div>
      <div id="resB"></div>
    </div>`);
  let solved = false;
  $('#cb').querySelectorAll('button').forEach(b => b.onclick = () => {
    if (solved) return;
    $('#cb').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    const n = +b.dataset.n;
    if (L % n) { $('#view').innerHTML = `<div class="banner bad">${L}글자는 ${n}칸으로 나누어떨어지지 않아요. 표를 꽉 채울 수 없으니 이 키는 아니에요.</div>`; return; }
    const r = L / n, grid = [];
    for (let c = 0; c < n; c++) for (let k = 0; k < r; k++) grid[k * n + c] = { ch: ct[c * r + k], c };
    $('#view').innerHTML = `<div class="muted" style="margin-top:14px">암호문을 <b>세로로</b> 채운 표 (색 = 같은 열)</div>
      <div class="tgrid" style="grid-template-columns:repeat(${n},62px)">${grid.map(g => `<div class="c${g.c % 8}">${esc(g.ch)}</div>`).join('')}</div>
      <div class="muted" style="margin-top:10px">→ <b>가로로</b> 읽으면</div><div class="readout">${esc(grid.map(g => g.ch).join(''))}</div>`;
    if (n === P.k) {
      solved = true;
      $('#resA').innerHTML = `<div class="banner ok">🎉 해독 성공! 키는 <b>${P.k}칸</b>, 메시지는 "<b>${P.m.replace(/_/g, ' ')}</b>"</div>
        <div class="explain">카이사르 암호(<b>치환</b>)는 글자 자체를 바꾸고, 전치 암호는 글자의 <b>위치</b>만 바꿔요. 현대 암호는 이 두 방법을 여러 번 섞어서 만듭니다.</div>`;
      $('#cardB').hidden = false; $('#cardB').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
  const check = () => {
    const v = $('#enc').value.toUpperCase().replace(/\s+/g, '');
    if (!v) return;
    if (v === eAns) {
      $('#enc').disabled = $('#encBtn').disabled = true;
      $('#resB').innerHTML = `<div class="banner ok">🎉 정답! ${E} → <b>${eAns}</b></div>`;
      S.rec.trans = `해독(${P.k}칸) + 암호화 성공`;
      complete('trans');
    } else $('#resB').innerHTML = `<div class="banner bad">다시 해 보세요. 첫 번째 열을 위에서 아래로 읽으면 ${E[0]}${E[3]}부터 시작해요.</div>`;
  };
  $('#encBtn').onclick = check;
  $('#enc').onkeydown = e => { if (e.key === 'Enter') check(); };
}

  { c: 'price = {"사과": 500, "배": 1200}\nprice["귤"] = 300\nprint(len(price))', o: ['2', '3', '300', '오류 발생'], a: 1, e: '딕셔너리에 없는 키에 값을 넣으면 <b>새 항목이 추가</b>돼요. 사과, 배, 귤로 3개입니다.' },
  { c: 'stock = {"사과": 3, "배": 5}\nprint(stock["귤"])', o: ['0', 'None', '오류 발생', '3'], a: 2, e: '딕셔너리에 <b>없는 키로 값을 꺼내려 하면</b> KeyError가 나요. 값을 <b>넣을 때</b>는 새 항목이 생기지만, <b>꺼낼 때</b>는 키가 반드시 있어야 합니다.' },
  { c: 'score = {"민수": [90, 80]}\nscore["민수"].append(70)\nprint(sum(score["민수"]))', o: ['170', '240', '70', '오류 발생'], a: 1, e: '딕셔너리의 값으로 <b>리스트</b>를 넣을 수 있어요. [90, 80, 70]이 되어 합은 240입니다.' },
  { c: '# 학교의 위치 (위도, 경도)처럼\n# 절대 바뀌면 안 되는 한 쌍의 값을\n# 담기에 가장 알맞은 자료형은?', o: ['리스트', '튜플', '딕셔너리', '정수'], a: 1, e: '<b>튜플</b>은 수정할 수 없어서 실수로 값이 바뀌는 일을 막아 줘요. 좌표, 생년월일처럼 고정된 묶음에 어울립니다.' },
];
function stepQuiz() {
  let n = 0, score = 0;
  frame(4, '리스트 · 튜플 · 딕셔너리 코드를 머릿속으로 실행해 결과를 맞힙니다.', `<div class="card" id="qz"></div>`);
  const show = () => {
    if (n >= QUIZ.length) {
      $('#qz').innerHTML = `<div style="text-align:center"><div style="font-size:64px">🏆</div><h1 style="margin:0">${score} / ${QUIZ.length}</h1>
        <p class="sub">리스트는 <b>순서대로 담고 바꿀 수 있는</b> 상자, 튜플은 <b>바꿀 수 없는</b> 묶음, 딕셔너리는 <b>이름표(키)로 찾는</b> 사전이에요.</p></div>`;
      S.rec.quiz = `${score} / ${QUIZ.length}`; complete('quiz'); return;
    }
    const q = QUIZ[n];
    $('#qz').innerHTML = `<div class="qhead"><span class="pill">문제 ${n + 1} / ${QUIZ.length}</span><span class="pill">맞힌 문제 ${score}</span></div>
      <p class="sub" style="margin:14px 0 0">${q.c.startsWith('#') ? '아래 질문에 답하세요.' : '이 코드를 실행하면 무엇이 출력될까요?'}</p>
      <pre class="code">${esc(q.c)}</pre>
      <div class="opts">${q.o.map((o, i) => `<button class="opt" data-i="${i}"><span class="n">${'①②③④'[i]}</span>${esc(o)}</button>`).join('')}</div>
      <div id="qres"></div>`;
    $('#qz').querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const ok = +b.dataset.i === q.a;
      $('#qz').querySelectorAll('.opt').forEach((x, k) => { x.disabled = true; if (k === q.a) x.classList.add('right'); });
      if (!ok) b.classList.add('wrong'); else score++;
      $('#qres').innerHTML = `<div class="banner ${ok ? 'ok' : 'bad'}">${ok ? '정답! 🎉' : '아쉬워요! 정답은 ' + '①②③④'[q.a] + '번'}</div>
        <div class="explain">${q.e}</div>
        <div class="row" style="justify-content:flex-end"><button class="btn" id="qn">${n + 1 < QUIZ.length ? '다음 문제 →' : '결과 보기 →'}</button></div>`;
      $('#qn').onclick = () => { n++; show(); $('#qz').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    });
  };
  show();
}

/* ================= FINALE ================= */
function finale() {
  const t = (S.end || Date.now()) - S.start;
  app.innerHTML = `<div class="card" style="text-align:center;margin-top:30px">
      <div class="tag" style="display:inline-block">SHOWCASE COMPLETE</div>
      <h1 style="margin-top:14px">👏 ${esc(S.name)}의 알고리즘 쇼케이스</h1>
      <p class="sub">이번 단원에서 배운 내용을 모두 시연했습니다. 걸린 시간 <b>${fmt(t)}</b></p>
    </div>
    <div class="card">
      <table class="cmp rec">${STEPS.map(s => `<tr><td>${s.ic} ${s.t}</td><td>${S.rec[s.k] ? esc(S.rec[s.k]) : '<span class="muted">건너뜀</span>'}</td></tr>`).join('')}</table>
      <ul class="list">
        <li><b>탐색</b> — 정렬된 데이터라면 이진 탐색이 순차 탐색보다 훨씬 빠르다</li>
        <li><b>정렬</b> — 버블 · 선택 · 삽입 정렬은 같은 결과를 다른 방법으로 만든다</li>
        <li><b>암호</b> — 글자를 바꾸는 치환(카이사르)과 위치를 바꾸는 전치</li>
        <li><b>자료구조</b> — 바꿀 수 있는 리스트, 바꿀 수 없는 튜플, 키로 찾는 딕셔너리</li>
      </ul>
      <div class="row" style="justify-content:center"><button class="btn ghost" id="again">처음으로</button></div>
    </div>`;
  $('#again').onclick = intro;
}

/* teacher jump: ?step=3 */
const q = new URLSearchParams(location.search);
if (q.has('step')) { S = fresh(); S.name = '리허설'; S.start = Date.now(); history.replaceState(null, '', location.pathname); go(Math.min(STEPS.length, Math.max(1, parseInt(q.get('step'), 10) || 1)) - 1); }
else intro();
})();
</script>
