<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>무대 위 알고리즘</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F4F6FB; --paper:#FFFFFF; --ink:#141824; --sub:#4A5268; --muted:#8A92A6; --line:#E3E7F0; --fill:#EEF1F8;
  --blue:#2F6BFF; --blue-soft:#E7EEFF; --pink:#FF3D71; --pink-soft:#FFE8EE; --green:#10A95B; --green-soft:#E4F7EC;
  --amber:#F59E0B; --amber-soft:#FFF4DC; --violet:#7C4DFF; --violet-soft:#EFE8FF;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Code",Consolas,"D2Coding",monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:22px;line-height:1.55;word-break:keep-all;min-height:100vh}
[hidden]{display:none!important}
button,input,select{font:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:24px 16px 60px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.back{appearance:none;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 16px;cursor:pointer;font-weight:700;color:var(--sub)}
.back:hover{border-color:var(--blue);color:var(--blue)}
.tag{font-size:15px;font-weight:800;letter-spacing:.06em;color:var(--blue);background:var(--blue-soft);border-radius:99px;padding:4px 12px}
h1{font-size:52px;line-height:1.15;margin:6px 0 4px;letter-spacing:-.02em}
h2{font-size:38px;line-height:1.2;margin:4px 0;letter-spacing:-.02em}
.sub{color:var(--sub)}
.muted{color:var(--muted);font-size:18px}
.card{background:var(--paper);border-radius:22px;padding:26px;margin-top:18px;box-shadow:0 1px 2px rgba(20,24,36,.04),0 8px 24px rgba(20,24,36,.05)}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 26px;font-weight:800;cursor:pointer;background:var(--blue);color:#fff;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--fill);color:var(--ink)}
.btn.pink{background:var(--pink)}.btn.green{background:var(--green)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}
.inp{flex:1;min-width:200px;background:var(--fill);border:2px solid transparent;border-radius:14px;padding:12px 16px;outline:none;color:var(--ink)}
.inp:focus{border-color:var(--blue);background:#fff}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.stat{background:var(--fill);border-radius:14px;padding:8px 18px;font-size:19px;color:var(--sub)}
.stat b{font-size:30px;color:var(--ink);font-variant-numeric:tabular-nums;margin-left:6px}
.banner{margin-top:18px;border-radius:16px;padding:16px 22px;font-weight:700}
.banner.ok{background:var(--green-soft);color:#08713D}
.banner.bad{background:var(--pink-soft);color:#C21746}
.banner.info{background:var(--blue-soft);color:#1E48B8}
.explain{margin-top:14px;background:var(--amber-soft);border-radius:14px;padding:14px 20px;color:#6B4A00;font-size:20px}
.explain b{color:#3D2A00}

/* menu */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;margin-top:22px}
.tile{appearance:none;text-align:left;border:0;background:var(--paper);border-radius:22px;padding:24px;cursor:pointer;box-shadow:0 1px 2px rgba(20,24,36,.04),0 8px 24px rgba(20,24,36,.05);transition:transform .15s,box-shadow .15s;color:var(--ink)}
.tile:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(20,24,36,.1)}
.tile .ic{font-size:40px}
.tile h3{font-size:28px;margin:6px 0 4px}
.tile p{margin:0;color:var(--sub);font-size:18px}
.tile .meta{margin-top:10px;font-size:15px;font-weight:700;color:var(--muted)}

/* search duel */
.target{display:inline-block;background:var(--ink);color:#fff;border-radius:16px;padding:6px 22px;font-size:44px;font-weight:900;font-variant-numeric:tabular-nums}
.lane{margin-top:22px}
.lane h3{margin:0;font-size:26px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lane .cnt{font-variant-numeric:tabular-nums;font-size:22px;color:var(--sub)}
.lane .cnt b{font-size:34px;color:var(--ink)}
.cards31{display:grid;grid-template-columns:repeat(31,1fr);gap:4px;margin-top:10px}
.sc{aspect-ratio:3/4.4;border:0;border-radius:8px;background:linear-gradient(180deg,#3B4A75,#26304F);color:#fff;font-weight:900;font-size:clamp(11px,1.3vw,18px);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .15s,opacity .3s}
.sc:hover:not(:disabled){transform:translateY(-4px)}
.sc.up{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.sc.hit{background:var(--green);color:#fff;transform:scale(1.15)}
.sc.out{opacity:.18}
.sc.next{box-shadow:0 0 0 3px var(--amber)}
.sc:disabled{cursor:default}
.idx{display:grid;grid-template-columns:repeat(31,1fr);gap:4px;font-size:11px;color:var(--muted);text-align:center;margin-top:2px}

/* sorting */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tabs button{appearance:none;border:0;background:var(--fill);border-radius:12px;padding:10px 20px;font-weight:800;cursor:pointer;color:var(--sub)}
.tabs button.on{background:var(--ink);color:#fff}
.stage{display:flex;align-items:flex-end;justify-content:center;gap:10px;flex-wrap:wrap;min-height:190px;margin-top:22px}
.nc{width:96px;height:130px;border-radius:16px;border:0;background:var(--paper);box-shadow:inset 0 0 0 3px var(--line);font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;display:grid;place-items:center;transition:transform .25s,background .2s,box-shadow .2s;color:var(--ink)}
button.nc{cursor:pointer}
button.nc:hover{box-shadow:inset 0 0 0 3px var(--blue)}
.nc.done{background:var(--green-soft);box-shadow:inset 0 0 0 3px var(--green);color:#08713D}
.nc.focus{box-shadow:inset 0 0 0 4px var(--amber);background:var(--amber-soft);transform:translateY(-10px)}
.nc.lift{transform:translateY(-34px);background:var(--violet-soft);box-shadow:inset 0 0 0 4px var(--violet)}
.nc.dim{opacity:.4}
.nc.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.gap{appearance:none;width:34px;height:130px;border-radius:10px;border:3px dashed var(--violet);background:var(--violet-soft);color:var(--violet);font-weight:900;cursor:pointer}
.gap:hover{background:var(--violet);color:#fff}
.decide{display:flex;gap:14px;justify-content:center;margin-top:20px}
.decide .btn{font-size:26px;padding:16px 36px}
.rule{margin-top:10px;font-size:20px;color:var(--sub);text-align:center}

/* cipher */
.big-ct{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.big-ct span{min-width:58px;height:76px;padding:0 6px;display:grid;place-items:center;border-radius:12px;background:var(--pink-soft);color:#C21746;font-family:var(--mono);font-size:42px;font-weight:900}
.big-ct.plain span{background:var(--blue-soft);color:#1E48B8}
.big-ct span.sp{background:transparent;min-width:24px}
.strip{display:grid;grid-template-columns:repeat(26,1fr);gap:3px;margin-top:6px;font-family:var(--mono);font-weight:800;font-size:clamp(12px,1.4vw,20px);text-align:center}
.strip div{background:var(--fill);border-radius:6px;padding:4px 0}
.strip.b div{background:var(--blue-soft);color:#1E48B8}
.slider{width:100%;margin-top:18px;accent-color:var(--blue);height:30px}
.keyv{font-size:40px;font-weight:900;color:var(--blue);font-variant-numeric:tabular-nums}
.tgrid{display:inline-grid;gap:6px;margin-top:14px}
.tgrid div{width:62px;height:62px;display:grid;place-items:center;border-radius:10px;background:var(--fill);font-family:var(--mono);font-size:32px;font-weight:900}
.tgrid div.c0{background:#FFE8EE}.tgrid div.c1{background:#E7EEFF}.tgrid div.c2{background:#E4F7EC}.tgrid div.c3{background:#FFF4DC}.tgrid div.c4{background:#EFE8FF}.tgrid div.c5{background:#E0F7FA}.tgrid div.c6{background:#FCE7F3}.tgrid div.c7{background:#F1F5F9}
.colbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.colbtns button{appearance:none;border:0;width:74px;height:64px;border-radius:14px;background:var(--fill);font-size:28px;font-weight:900;cursor:pointer;color:var(--ink)}
.colbtns button.on{background:var(--ink);color:#fff}
.readout{margin-top:14px;font-family:var(--mono);font-size:34px;font-weight:900;letter-spacing:.06em}

/* quiz */
pre.code{background:#121726;color:#E8EEFF;border-radius:18px;padding:22px 26px;font-family:var(--mono);font-size:30px;line-height:1.6;overflow-x:auto;margin:18px 0 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.opt{appearance:none;border:0;border-radius:16px;padding:18px 22px;text-align:left;font-size:28px;font-weight:800;background:var(--fill);cursor:pointer;color:var(--ink);font-family:var(--mono)}
.opt:hover:not(:disabled){background:var(--blue-soft)}
.opt .n{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#fff;margin-right:12px;font-family:var(--font);font-size:20px}
.opt.right{background:var(--green);color:#fff}
.opt.wrong{background:var(--pink);color:#fff}
.opt:disabled{cursor:default}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pill{background:var(--fill);border-radius:99px;padding:6px 16px;font-weight:800;font-size:18px;color:var(--sub)}
@media (max-width:760px){body{font-size:18px}h1{font-size:36px}h2{font-size:28px}.opts{grid-template-columns:1fr}.nc{width:64px;height:90px;font-size:30px}.gap{height:90px;width:26px}pre.code{font-size:20px}.opt{font-size:20px}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const app = $('#app');
const head = (tag, title, desc) => `<div class="top"><button class="back" id="back">← 메뉴</button><span class="tag">${tag}</span></div>
  <h2>${title}</h2><p class="sub" style="margin:4px 0 0">${desc}</p>`;
const bindBack = () => { $('#back').onclick = menu; };

/* ================= MENU ================= */
const CH = [
  { id: 'search', ic: '🔎', t: '탐색 대결', d: '순차 탐색 vs 이진 탐색. 두 학생이 같은 숫자를 누가 더 적게 뒤집고 찾는지 겨룹니다.', m: '학생 2명 · 약 5분', f: searchDuel },
  { id: 'sort', ic: '📊', t: '정렬 미션', d: '버블 · 선택 · 삽입 정렬. 학생이 알고리즘 규칙대로 카드를 직접 움직여야 통과합니다.', m: '학생 1~3명 · 약 8분', f: sortMission },
  { id: 'caesar', ic: '🔐', t: '카이사르 암호 해독', d: '부모님이 정한 비밀 메시지를 암호화하면, 학생이 키를 찾아 해독합니다.', m: '부모님 + 학생 1명 · 약 5분', f: caesar },
  { id: 'trans', ic: '🧩', t: '전치 암호 해독', d: '글자 순서만 뒤섞는 암호. 표의 칸 수를 찾아 원래 문장을 복원합니다.', m: '부모님 + 학생 1명 · 약 5분', f: transposition },
  { id: 'quiz', ic: '🐍', t: '파이썬 자료구조 퀴즈쇼', d: '리스트 · 튜플 · 딕셔너리 코드의 실행 결과 맞히기. 부모님과 함께 예측해 보세요.', m: '학생 여러 명 · 약 8분', f: quizShow },
];
function menu() {
  app.innerHTML = `<div class="top"><span class="tag">정보 수업 · 무대 챌린지</span></div>
    <h1>무대 위 알고리즘</h1>
    <p class="sub">학생이 앞에 나와 직접 풀어 보는 시간입니다. 도전할 미션을 고르세요.</p>
    <div class="grid">${CH.map(c => `<button class="tile" data-id="${c.id}"><div class="ic">${c.ic}</div><h3>${c.t}</h3><p>${c.d}</p><div class="meta">${c.m}</div></button>`).join('')}</div>
    <p class="muted" style="margin-top:24px">추천 순서: 탐색 대결 → 정렬 미션 → 카이사르 암호 → 전치 암호 → 퀴즈쇼</p>`;
  app.querySelectorAll('.tile').forEach(b => b.onclick = () => { CH.find(c => c.id === b.dataset.id).f(); window.scrollTo(0, 0); });
}

/* ================= SEARCH DUEL ================= */
function searchDuel() {
  const N = 31;
  let nums, target, seq, bin;
  const newGame = () => {
    const pool = shuffle(Array.from({ length: 99 }, (_, i) => i + 1)).slice(0, N).sort((a, b) => a - b);
    nums = pool; target = nums[rnd(12, N - 1)];
    seq = { up: new Set(), next: 0, count: 0, found: false };
    bin = { up: new Set(), lo: 0, hi: N - 1, count: 0, found: false };
  };
  newGame();
  app.innerHTML = head('탐색', '탐색 대결: 순차 vs 이진', `카드 31장에 1~99 사이 숫자가 <b>작은 순서대로</b> 엎어져 있어요. 아래 숫자를 찾을 때까지 카드를 뒤집으세요.`) + `
    <div class="card">
      <div class="row" style="margin-top:0;justify-content:space-between">
        <div>찾을 숫자 <span class="target" id="tg"></span></div>
        <button class="btn ghost" id="ng">새 게임</button>
      </div>
      <div class="lane"><h3>🐢 순차 탐색 <span class="muted">왼쪽부터 한 장씩만 뒤집을 수 있어요</span><span class="cnt" style="margin-left:auto">뒤집은 횟수 <b id="sc">0</b></span></h3>
        <div class="cards31" id="sl"></div><div class="idx">${Array.from({ length: N }, (_, i) => `<span>${i + 1}</span>`).join('')}</div></div>
      <div class="lane"><h3>🐇 이진 탐색 <span class="muted">아무 카드나 뒤집을 수 있어요. 어디부터 볼까요?</span><span class="cnt" style="margin-left:auto">뒤집은 횟수 <b id="bc">0</b></span></h3>
        <div class="cards31" id="bl"></div><div class="idx">${Array.from({ length: N }, (_, i) => `<span>${i + 1}</span>`).join('')}</div></div>
      <div id="res"></div>
    </div>`;
  bindBack();
  const draw = () => {
    $('#tg').textContent = target;
    $('#sl').innerHTML = nums.map((v, i) => {
      const up = seq.up.has(i), hit = up && v === target;
      return `<button class="sc ${up ? 'up' : ''} ${hit ? 'hit' : ''} ${!seq.found && i === seq.next ? 'next' : ''}" data-i="${i}" ${seq.found || i !== seq.next ? 'disabled' : ''}>${up ? v : '?'}</button>`;
    }).join('');
    $('#bl').innerHTML = nums.map((v, i) => {
      const up = bin.up.has(i), hit = up && v === target, out = !bin.found && !up && (i < bin.lo || i > bin.hi);
      return `<button class="sc ${up ? 'up' : ''} ${hit ? 'hit' : ''} ${out ? 'out' : ''}" data-i="${i}" ${bin.found || up || out ? 'disabled' : ''}>${up ? v : '?'}</button>`;
    }).join('');
    $('#sc').textContent = seq.count; $('#bc').textContent = bin.count;
    $('#sl').querySelectorAll('.sc:not(:disabled)').forEach(b => b.onclick = () => flipSeq(+b.dataset.i));
    $('#bl').querySelectorAll('.sc:not(:disabled)').forEach(b => b.onclick = () => flipBin(+b.dataset.i));
    result();
  };
  const flipSeq = i => { seq.up.add(i); seq.count++; seq.next++; if (nums[i] === target) seq.found = true; draw(); };
  const flipBin = i => {
    bin.up.add(i); bin.count++;
    if (nums[i] === target) bin.found = true;
    else if (nums[i] < target) bin.lo = Math.max(bin.lo, i + 1);
    else bin.hi = Math.min(bin.hi, i - 1);
    draw();
  };
  const result = () => {
    let h = '';
    if (!bin.found && bin.up.size) h += `<div class="banner info">이진 탐색: 아직 후보가 <b>${bin.hi - bin.lo + 1}장</b> 남았어요. (흐려진 카드는 볼 필요가 없어진 카드)</div>`;
    if (seq.found && bin.found) {
      h += `<div class="banner ok">🏁 순차 탐색 <b>${seq.count}번</b> vs 이진 탐색 <b>${bin.count}번</b>!${seq.count < bin.count ? ' 이번엔 순차 탐색이 운이 좋았네요. 새 게임으로 한 번 더!' : ''}</div>
        <div class="explain"><b>순차 탐색</b>은 처음부터 하나씩 보기 때문에 최악의 경우 31번이 걸려요.
        <b>이진 탐색</b>은 정렬된 데이터의 가운데를 보고 절반을 버리기 때문에 31장이면 <b>최대 5번</b>이면 충분합니다 (31 → 15 → 7 → 3 → 1).
        단, 이진 탐색은 데이터가 <b>정렬되어 있을 때만</b> 쓸 수 있어요.</div>`;
    }
    $('#res').innerHTML = h;
  };
  $('#ng').onclick = () => { newGame(); draw(); };
  draw();
}

/* ================= SORT MISSION ================= */
function sortMission(mode = 'bubble') {
  const N = 6;
  const make = () => shuffle(Array.from({ length: 50 }, (_, i) => i + 1)).slice(0, N);
  const DESC = {
    bubble: { t: '버블 정렬', r: '노란 두 카드를 비교하세요. 왼쪽이 더 크면 <b>교환</b>, 아니면 <b>그대로</b>.', e: '<b>버블 정렬</b>은 이웃한 두 값을 비교해 큰 값을 오른쪽으로 보내요. 한 바퀴 돌 때마다 가장 큰 값이 맨 끝에 자리 잡습니다. 거품이 위로 떠오르는 모습과 닮아 이런 이름이 붙었어요.' },
    select: { t: '선택 정렬', r: '정렬되지 않은 카드 중 <b>가장 작은 카드</b>를 클릭하세요. 맨 앞으로 옮겨집니다.', e: '<b>선택 정렬</b>은 남은 것 중 가장 작은 값을 "선택"해 앞으로 보내는 방법이에요. 교환은 적지만, 가장 작은 값을 찾기 위해 남은 카드를 매번 모두 비교해야 합니다.' },
    insert: { t: '삽입 정렬', r: '보라색 카드가 들어갈 <b>자리(점선)</b>를 클릭하세요. 왼쪽 정렬된 카드들 사이에 끼워 넣습니다.', e: '<b>삽입 정렬</b>은 카드 게임에서 손에 든 패를 정리하듯, 새 카드를 이미 정렬된 카드들 사이 알맞은 자리에 "삽입"해요. 거의 정렬된 데이터에서는 아주 빠릅니다.' },
  };
  let a = make(), st;
  const reset = () => {
    st = { comp: 0, swap: 0, miss: 0, done: false, i: mode === 'insert' ? 1 : 0, j: 0, pass: 0, swapped: false, sortedFrom: N, flash: -1 };
  };
  reset();
  app.innerHTML = head('정렬', '정렬 미션', '알고리즘의 규칙대로만 움직여야 통과할 수 있어요. 규칙을 어기면 카드가 흔들립니다.') + `
    <div class="tabs" id="tabs">${Object.entries(DESC).map(([k, v]) => `<button data-m="${k}" class="${k === mode ? 'on' : ''}">${v.t}</button>`).join('')}</div>
    <div class="card">
      <div class="rule" id="rule"></div>
      <div class="stage" id="stg"></div>
      <div id="ctl"></div>
      <div class="stats"><div class="stat">비교<b id="c1">0</b></div><div class="stat">이동·교환<b id="c2">0</b></div><div class="stat">실수<b id="c3">0</b></div>
        <button class="btn ghost" id="again" style="margin-left:auto">새 카드</button></div>
      <div id="res"></div>
    </div>`;
  bindBack();
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => sortMission(b.dataset.m));
  $('#again').onclick = () => { a = make(); reset(); draw(); };
  const miss = el => { st.miss++; if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } $('#c3').textContent = st.miss; };
  const finish = () => {
    st.done = true;
    $('#res').innerHTML = `<div class="banner ok">🎉 정렬 완료! 비교 ${st.comp}번 · 이동·교환 ${st.swap}번 · 실수 ${st.miss}번</div><div class="explain">${DESC[mode].e}</div>`;
  };
  const card = (v, cls = '', tag = 'div', attrs = '') => `<${tag} class="nc ${cls}" ${attrs}>${v}</${tag}>`;
  function draw() {
    $('#rule').innerHTML = st.done ? '' : DESC[mode].r;
    $('#c1').textContent = st.comp; $('#c2').textContent = st.swap; $('#c3').textContent = st.miss;
    let h = '', ctl = '';
    if (mode === 'bubble') {
      h = a.map((v, k) => card(v, st.done || k >= st.sortedFrom ? 'done' : (k === st.j || k === st.j + 1 ? 'focus' : ''))).join('');
      if (!st.done) ctl = `<div class="decide"><button class="btn pink" id="sw">⇄ 교환</button><button class="btn ghost" id="keep">그대로 →</button></div>`;
    } else if (mode === 'select') {
      h = a.map((v, k) => k < st.i || st.done ? card(v, 'done') : card(v, '', 'button', `data-k="${k}"`)).join('');
    } else {
      if (st.done) h = a.map(v => card(v, 'done')).join('');
      else {
        for (let k = 0; k <= st.i; k++) {
          h += `<button class="gap" data-g="${k}" aria-label="${k + 1}번째 자리에 넣기">▼</button>`;
          if (k < st.i) h += card(a[k], 'done');
        }
        h += card(a[st.i], 'lift');
        for (let k = st.i + 1; k < N; k++) h += card(a[k], 'dim');
      }
    }
    $('#stg').innerHTML = h; $('#ctl').innerHTML = ctl;
    if (mode === 'bubble' && !st.done) {
      const decide = doSwap => {
        const need = a[st.j] > a[st.j + 1];
        if (need !== doSwap) { miss($('#stg').children[st.j]); $('#res').innerHTML = `<div class="banner bad">${a[st.j]}와(과) ${a[st.j + 1]}을(를) 다시 비교해 보세요.</div>`; return; }
        $('#res').innerHTML = '';
        st.comp++;
        if (doSwap) { [a[st.j], a[st.j + 1]] = [a[st.j + 1], a[st.j]]; st.swap++; st.swapped = true; }
        st.j++;
        if (st.j >= N - 1 - st.pass) {
          st.sortedFrom = N - 1 - st.pass; st.pass++;
          if (!st.swapped || st.pass >= N - 1) { st.sortedFrom = 0; draw(); return finish(); }
          st.j = 0; st.swapped = false;
        }
        draw();
      };
      $('#sw').onclick = () => decide(true);
      $('#keep').onclick = () => decide(false);
    }
    if (mode === 'select' && !st.done) {
      $('#stg').querySelectorAll('button.nc').forEach(b => b.onclick = () => {
        const k = +b.dataset.k, rest = a.slice(st.i), min = Math.min(...rest);
        if (a[k] !== min) { miss(b); $('#res').innerHTML = `<div class="banner bad">${a[k]}보다 더 작은 카드가 남아 있어요.</div>`; return; }
        $('#res').innerHTML = '';
        st.comp += N - 1 - st.i;
        if (k !== st.i) { [a[k], a[st.i]] = [a[st.i], a[k]]; st.swap++; }
        st.i++;
        if (st.i >= N - 1) { st.i = N; draw(); return finish(); }
        draw();
      });
    }
    if (mode === 'insert' && !st.done) {
      $('#stg').querySelectorAll('.gap').forEach(b => b.onclick = () => {
        const g = +b.dataset.g, key = a[st.i];
        let right = 0; while (right < st.i && a[right] <= key) right++;
        if (g !== right) { miss(b); $('#res').innerHTML = `<div class="banner bad">${key}이(가) 들어가기에 알맞은 자리가 아니에요. 양옆 숫자를 보세요.</div>`; return; }
        $('#res').innerHTML = '';
        st.comp += Math.min(st.i, st.i - g + 1);
        if (g !== st.i) { a.splice(st.i, 1); a.splice(g, 0, key); st.swap += st.i - g; }
        st.i++;
        if (st.i >= N) { draw(); return finish(); }
        draw();
      });
    }
  }
  draw();
}

/* ================= CAESAR ================= */
const AZ = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const shiftC = (s, k) => s.split('').map(c => { const i = AZ.indexOf(c); return i < 0 ? c : AZ[(i + k + 26) % 26]; }).join('');
const cleanMsg = s => s.toUpperCase().replace(/[^A-Z ]/g, '').replace(/\s+/g, ' ').trim();
const letters = (s, cls = '') => `<div class="big-ct ${cls}">${s.split('').map(c => c === ' ' ? '<span class="sp"></span>' : `<span>${esc(c)}</span>`).join('')}</div>`;

function caesar() {
  app.innerHTML = head('암호', '카이사르 암호 해독', '알파벳을 정해진 칸 수(키)만큼 밀어서 바꾸는 <b>치환 암호</b>예요.') + `
    <div class="card">
      <h3 style="margin:0;font-size:28px">1단계 · 부모님이 비밀 메시지를 정해 주세요</h3>
      <p class="muted" style="margin:4px 0 0">영어 대문자로 입력됩니다. 학생은 잠시 뒤돌아 있어 주세요!</p>
      <div class="row"><input class="inp" id="msg" maxlength="24" placeholder="예: THANK YOU MOM" autocomplete="off"></div>
      <div class="row"><span>키 (1~25)</span><input class="inp" id="key" type="number" min="1" max="25" value="3" style="max-width:140px"><button class="btn ghost" id="rk">무작위 키</button>
        <button class="btn" id="go" style="margin-left:auto">암호화하고 학생에게 넘기기 →</button></div>
      <div id="err"></div>
    </div>`;
  bindBack();
  $('#rk').onclick = () => { $('#key').value = rnd(1, 25); };
  $('#go').onclick = () => {
    const m = cleanMsg($('#msg').value), k = parseInt($('#key').value, 10);
    if (!m) { $('#err').innerHTML = '<div class="banner bad">영어로 메시지를 입력해 주세요.</div>'; return; }
    if (!(k >= 1 && k <= 25)) { $('#err').innerHTML = '<div class="banner bad">키는 1부터 25 사이로 정해 주세요.</div>'; return; }
    caesarSolve(m, k);
  };
}
function caesarSolve(msg, key) {
  const ct = shiftC(msg, key);
  let tries = new Set([0]);
  app.innerHTML = head('암호', '카이사르 암호 해독', '부모님이 보낸 암호문입니다. 슬라이더로 키를 바꿔 원래 메시지를 찾아보세요.') + `
    <div class="card">
      <div class="muted">🔒 암호문</div>${letters(ct)}
      <input type="range" class="slider" id="k" min="0" max="25" value="0">
      <div class="row" style="justify-content:space-between;margin-top:4px"><span>뒤로 민 칸 수 <span class="keyv" id="kv">0</span></span><span class="muted" id="tr"></span></div>
      <div class="strip" id="s1">${AZ.split('').map(c => `<div>${c}</div>`).join('')}</div>
      <div class="strip b" id="s2"></div>
      <div class="muted" style="margin-top:14px">🔓 해독 결과</div><div id="pt"></div>
      <div class="row"><button class="btn ghost" id="reveal">정답 공개 (선생님용)</button><button class="btn ghost" id="again">새 메시지</button></div>
      <div id="res"></div>
    </div>`;
  bindBack();
  let solved = false;
  const draw = k => {
    $('#kv').textContent = k; tries.add(k);
    $('#tr').textContent = `시도한 키 ${tries.size}개 / 26개`;
    $('#s2').innerHTML = AZ.split('').map(c => `<div>${shiftC(c, -k)}</div>`).join('');
    $('#pt').innerHTML = letters(shiftC(ct, -k), 'plain');
    if (k === key && !solved) {
      solved = true;
      $('#res').innerHTML = `<div class="banner ok">🎉 해독 성공! 키는 <b>${key}</b>, 메시지는 "<b>${esc(msg)}</b>"</div>
        <div class="explain">카이사르 암호는 키가 <b>26가지</b>뿐이라, 방금처럼 하나씩 다 시도해 보면(<b>무차별 대입</b>) 금방 풀려요.
        그래서 오늘날 인터넷 뱅킹 같은 곳에서 쓰는 암호는 키의 경우의 수를 상상할 수 없을 만큼 크게 만듭니다.</div>`;
    }
  };
  $('#k').oninput = e => draw(+e.target.value);
  $('#reveal').onclick = () => { $('#k').value = key; draw(key); };
  $('#again').onclick = caesar;
  draw(0);
}

/* ================= TRANSPOSITION ================= */
function transposition() {
  app.innerHTML = head('암호', '전치 암호 해독', '글자는 그대로 두고 <b>순서만</b> 뒤섞는 암호예요. 표에 가로로 쓰고, 세로로 읽어서 만듭니다.') + `
    <div class="card">
      <h3 style="margin:0;font-size:28px">1단계 · 부모님이 비밀 메시지를 정해 주세요</h3>
      <p class="muted" style="margin:4px 0 0">영어 대문자로 입력되고, 띄어쓰기는 _ 로 표시됩니다.</p>
      <div class="row"><input class="inp" id="msg" maxlength="30" placeholder="예: WE LOVE YOU" autocomplete="off"></div>
      <div class="row"><span>표의 칸 수 (키)</span>
        <select class="inp" id="key" style="max-width:140px">${[2, 3, 4, 5, 6].map(n => `<option ${n === 4 ? 'selected' : ''}>${n}</option>`).join('')}</select>
        <button class="btn" id="go" style="margin-left:auto">암호화하고 학생에게 넘기기 →</button></div>
      <div id="err"></div>
    </div>`;
  bindBack();
  $('#go').onclick = () => {
    const m = cleanMsg($('#msg').value).replace(/ /g, '_');
    if (m.length < 4) { $('#err').innerHTML = '<div class="banner bad">영어로 4글자 이상 입력해 주세요.</div>'; return; }
    transSolve(m, +$('#key').value);
  };
}
function transSolve(msg, C) {
  let p = msg; while (p.length % C) p += '·';
  const R = p.length / C;
  let ct = ''; for (let c = 0; c < C; c++) for (let r = 0; r < R; r++) ct += p[r * C + c];
  const L = ct.length;
  app.innerHTML = head('암호', '전치 암호 해독', `암호문은 ${L}글자예요. 원래 문장을 <b>몇 칸짜리 표</b>에 가로로 썼는지 찾으면 풀립니다.`) + `
    <div class="card">
      <div class="muted">🔒 암호문 (세로로 읽어 만든 것)</div>${letters(ct)}
      <div class="muted" style="margin-top:18px">표의 칸 수를 골라 보세요</div>
      <div class="colbtns" id="cb">${[2, 3, 4, 5, 6, 7, 8].map(n => `<button data-n="${n}">${n}</button>`).join('')}</div>
      <div id="view"></div>
      <div class="row"><button class="btn ghost" id="again">새 메시지</button></div>
      <div id="res"></div>
    </div>`;
  bindBack();
  $('#again').onclick = transposition;
  let solved = false;
  $('#cb').querySelectorAll('button').forEach(b => b.onclick = () => {
    $('#cb').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    const n = +b.dataset.n;
    if (L % n) { $('#view').innerHTML = `<div class="banner bad">${L}글자는 ${n}칸으로 나누어떨어지지 않아요. 표를 꽉 채울 수 없으니 이 키는 아니에요.</div>`; return; }
    const r = L / n, grid = [];
    for (let c = 0; c < n; c++) for (let k = 0; k < r; k++) grid[k * n + c] = { ch: ct[c * r + k], c };
    const read = grid.map(g => g.ch).join('');
    $('#view').innerHTML = `<div class="muted" style="margin-top:14px">암호문을 <b>세로로</b> 채운 표 (색 = 같은 열)</div>
      <div class="tgrid" style="grid-template-columns:repeat(${n},62px)">${grid.map(g => `<div class="c${g.c % 8}">${esc(g.ch)}</div>`).join('')}</div>
      <div class="muted" style="margin-top:10px">→ <b>가로로</b> 읽으면</div><div class="readout">${esc(read)}</div>`;
    if (n === C && !solved) {
      solved = true;
      $('#res').innerHTML = `<div class="banner ok">🎉 해독 성공! 키는 <b>${C}칸</b>, 메시지는 "<b>${esc(msg.replace(/_/g, ' '))}</b>"</div>
        <div class="explain"><b>전치 암호</b>는 글자를 바꾸지 않고 <b>위치만</b> 바꿔요. 카이사르 암호(치환)는 글자 자체를 바꾸죠.
        실제 현대 암호는 이 두 방법, <b>치환과 전치</b>를 여러 번 섞어서 만듭니다.</div>`;
    }
  });
}

/* ================= QUIZ SHOW ================= */
const QUIZ = [
  { c: 'a = [3, 1, 4]\na.append(1)\nprint(len(a))', o: ['3', '4', '5', '[3, 1, 4, 1]'], a: 1, e: '<b>append</b>는 리스트 맨 뒤에 값을 하나 추가해요. [3, 1, 4, 1]이 되어 길이는 4입니다.' },
  { c: 'a = [10, 20, 30, 40]\nprint(a[1:3])', o: ['[10, 20]', '[20, 30]', '[20, 30, 40]', '[10, 20, 30]'], a: 1, e: '인덱스는 <b>0부터</b> 시작해요. a[1:3]은 1번부터 3번 <b>직전</b>까지, 즉 20과 30입니다.' },
  { c: 'a = [5, 3, 8, 1]\na.sort()\nprint(a[0], a[-1])', o: ['5 1', '1 8', '8 1', '3 8'], a: 1, e: '<b>sort()</b>로 오름차순 정렬하면 [1, 3, 5, 8]. a[0]은 맨 앞, a[-1]은 <b>맨 뒤</b> 값이에요.' },
  { c: 't = (1, 2, 3)\nt[0] = 9\nprint(t)', o: ['(9, 2, 3)', '(1, 2, 3)', '오류 발생', '9'], a: 2, e: '<b>튜플은 한번 만들면 바꿀 수 없어요.</b> 값을 바꾸려 하면 TypeError가 납니다. 바뀌면 안 되는 데이터를 지킬 때 튜플을 써요.' },
  { c: 'x, y = (7, 4)\nprint(x - y)', o: ['3', '(7, 4)', '-3', '오류 발생'], a: 0, e: '튜플의 값을 변수 여러 개에 한 번에 나눠 담을 수 있어요(<b>언패킹</b>). x = 7, y = 4이므로 3입니다.' },
  { c: 'price = {"사과": 500, "배": 1200}\nprice["귤"] = 300\nprint(len(price))', o: ['2', '3', '300', '오류 발생'], a: 1, e: '딕셔너리에 없는 키에 값을 넣으면 <b>새 항목이 추가</b>돼요. 사과, 배, 귤로 3개입니다.' },
  { c: 'd = {"a": 1, "b": 2}\nd["a"] = d["a"] + 10\nprint(d["a"])', o: ['1', '10', '11', '12'], a: 2, e: '딕셔너리는 <b>키로 값을 찾고 바꿀 수 있어요</b>. "a"의 값 1에 10을 더해 11이 됩니다.' },
  { c: 'score = {"민수": [90, 80]}\nscore["민수"].append(70)\nprint(sum(score["민수"]))', o: ['170', '240', '70', '오류 발생'], a: 1, e: '딕셔너리의 값으로 <b>리스트</b>를 넣을 수 있어요. [90, 80, 70]이 되어 합은 240입니다.' },
  { c: '# 학교의 위치 (위도, 경도)처럼\n# 절대 바뀌면 안 되는 한 쌍의 값을\n# 담기에 가장 알맞은 자료형은?', o: ['리스트', '튜플', '딕셔너리', '정수'], a: 1, e: '<b>튜플</b>은 수정할 수 없어서 실수로 값이 바뀌는 일을 막아 줘요. 좌표, 생년월일처럼 고정된 묶음에 잘 어울립니다.' },
];
function quizShow(n = 0, score = 0) {
  if (n >= QUIZ.length) {
    app.innerHTML = head('파이썬', '퀴즈쇼 결과', '') + `<div class="card" style="text-align:center">
      <div style="font-size:72px">🏆</div><h1>${score} / ${QUIZ.length}</h1>
      <p class="sub">리스트는 <b>순서대로 담고 바꿀 수 있는</b> 상자, 튜플은 <b>바꿀 수 없는</b> 묶음, 딕셔너리는 <b>이름표(키)로 찾는</b> 사전이에요.</p>
      <div class="row" style="justify-content:center"><button class="btn" id="re">처음부터</button></div></div>`;
    bindBack(); $('#re').onclick = () => quizShow(); return;
  }
  const q = QUIZ[n];
  app.innerHTML = head('파이썬', '자료구조 퀴즈쇼', '') + `<div class="card">
    <div class="qhead"><span class="pill">문제 ${n + 1} / ${QUIZ.length}</span><span class="pill">맞힌 문제 ${score}</span></div>
    <p class="sub" style="margin:14px 0 0">${q.c.startsWith('#') ? '아래 질문에 답하세요.' : '이 코드를 실행하면 무엇이 출력될까요?'} <span class="muted">— 누르기 전에 부모님께 먼저 물어보세요! 🙋</span></p>
    <pre class="code">${esc(q.c)}</pre>
    <div class="opts">${q.o.map((o, i) => `<button class="opt" data-i="${i}"><span class="n">${'①②③④'[i]}</span>${esc(o)}</button>`).join('')}</div>
    <div id="res"></div></div>`;
  bindBack();
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const i = +b.dataset.i, ok = i === q.a;
    app.querySelectorAll('.opt').forEach((x, k) => { x.disabled = true; if (k === q.a) x.classList.add('right'); });
    if (!ok) b.classList.add('wrong');
    $('#res').innerHTML = `<div class="banner ${ok ? 'ok' : 'bad'}">${ok ? '정답! 🎉' : '아쉬워요! 정답은 ' + '①②③④'[q.a] + '번'}</div>
      <div class="explain">${q.e}</div>
      <div class="row" style="justify-content:flex-end"><button class="btn" id="nx">${n + 1 < QUIZ.length ? '다음 문제 →' : '결과 보기 →'}</button></div>`;
    $('#nx').onclick = () => { quizShow(n + 1, score + (ok ? 1 : 0)); window.scrollTo(0, 0); };
  });
}
